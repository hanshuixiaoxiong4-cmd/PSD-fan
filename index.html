<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PerthSanta</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:#07060f;color:#fff;user-select:none;
  -webkit-user-select:none;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}

/* ============ 背景层 ============ */
#bg-layer{
  position:fixed;inset:-6%;z-index:-3;
  background:linear-gradient(135deg,#0b0a14,#1a1140 50%,#2a0f30);
  background-size:cover;background-position:center;
  transition:filter .3s;
}
#bg-overlay{position:fixed;inset:0;z-index:-2;background:rgba(7,6,15,.35);transition:background .3s}
#bg-vignette{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,.55) 100%);
}

/* ============ 屏幕 ============ */
.screen{
  position:fixed;inset:0;display:none;flex-direction:column;
}
.screen.active{display:flex;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============ 开场动画 ============ */
#intro{
  z-index:100;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,#160e2e 0%,#080614 60%,#030209 100%);
  overflow:hidden;
}
#intro::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 45%,rgba(176,108,255,.16),transparent 55%);
  opacity:0;animation:glowIn 3s ease 1.2s forwards;pointer-events:none;
}
@keyframes glowIn{to{opacity:1}}

.intro-inner{position:relative;z-index:3;text-align:center;padding:0 24px;display:flex;flex-direction:column;align-items:center;width:100%;max-width:500px}

.intro-welcome{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100%;display:flex;flex-direction:column;align-items:center;
  opacity:0;transition:opacity .6s ease, transform .6s ease;
}
.intro-welcome.show{opacity:1;transform:translate(-50%,-50%)}
.intro-welcome.hide{opacity:0;transform:translate(-50%,-60%);pointer-events:none}
.welcome-title{
  font-size:clamp(24px,6.5vw,36px);font-weight:800;letter-spacing:.08em;
  color:#fff;text-shadow:0 0 20px rgba(176,108,255,.8);
  display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
}
.welcome-sub{
  margin-top:14px;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.2em;
}
.loading-bar{
  margin-top:30px;width:60%;max-width:260px;height:6px;
  background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;
}
.loading-fill{
  width:0%;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#b06cff,#ff6ec7,#4ac6ff);
  transition:width 2.2s cubic-bezier(.2,.8,.2,1);
}

.intro-lines{
  margin-top:9vh;display:flex;flex-direction:column;gap:26px;
  opacity:0;transition:opacity .5s ease;
}
.intro-lines.show{opacity:1}
.intro-line{
  opacity:0;transform:translateY(18px);filter:blur(10px);
  transition:opacity .95s cubic-bezier(.2,.8,.2,1),transform .95s cubic-bezier(.2,.8,.2,1),filter .95s;
  letter-spacing:.1em;line-height:1.5;
}
.intro-line.show{opacity:1;transform:none;filter:blur(0)}
.intro-line:nth-child(1){font-size:clamp(20px,5.6vw,30px);color:#fff;font-weight:600}
.intro-line:nth-child(2){font-size:clamp(16px,4.6vw,24px);color:#ffd479;letter-spacing:.02em}
.intro-line:nth-child(3){font-size:clamp(17px,4.8vw,26px);color:#c99bff;font-style:italic}

.skip-btn{
  position:absolute;bottom:36px;right:24px;z-index:5;
  font-size:13px;color:rgba(255,255,255,.4);letter-spacing:.1em;
  padding:8px 16px;border:1px solid rgba(255,255,255,.15);border-radius:20px;
  opacity:0;animation:fadeIn .8s ease 1s forwards;
}
@keyframes fadeIn{to{opacity:1}}
#intro.fading{animation:introOut .8s ease forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.08);filter:blur(6px)}}

/* ============ 主页 ============ */
#home{padding:0 16px}
.home-header{text-align:center;padding:calc(env(safe-area-inset-top) + 6vh) 0 3vh;flex-shrink:0}
.home-header h1{
  font-size:clamp(28px,8.5vw,44px);font-weight:800;letter-spacing:.14em;
  background:linear-gradient(90deg,#fff,#c99bff,#ff6ec7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(176,108,255,.45));
}
.home-header p{margin-top:10px;font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.18em}
.home-header .thai{margin-top:4px;font-size:11px;color:rgba(255,212,121,.5);letter-spacing:.05em}

.game-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  max-width:620px;width:100%;margin:0 auto;flex:1;overflow-y:auto;
  padding:6px 2px calc(env(safe-area-inset-bottom) + 110px);
  align-content:start;
}
.game-grid::-webkit-scrollbar{display:none}

.game-card{
  position:relative;border-radius:22px;padding:24px 14px 20px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;align-items:center;gap:9px;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  overflow:hidden;
}
.game-card::before{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at 50% 0%,var(--c,rgba(176,108,255,.35)),transparent 70%);
}
.game-card:active{transform:scale(.95)}
.game-card:hover{border-color:rgba(255,255,255,.25);box-shadow:0 8px 30px rgba(176,108,255,.2)}
.game-card:hover::before{opacity:1}
.game-card .icon{font-size:40px;position:relative;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.game-card .name{font-size:15px;font-weight:700;letter-spacing:.06em;position:relative;z-index:1}
.game-card .prog{
  font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.05em;
  position:relative;z-index:1;
}
.game-card .bar{
  width:64%;height:3px;border-radius:2px;background:rgba(255,255,255,.1);
  overflow:hidden;position:relative;z-index:1;margin-top:2px;
}
.game-card .bar i{
  display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,#b06cff,#ff6ec7);transition:width .4s;
}

.settings-fab{
  position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);
  width:52px;height:52px;border-radius:50%;z-index:20;
  background:linear-gradient(135deg,rgba(176,108,255,.9),rgba(255,110,199,.9));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 8px 28px rgba(176,108,255,.45);
  transition:transform .2s;
}
.settings-fab:active{transform:scale(.9) rotate(45deg)}

/* ============ 通用顶栏 ============ */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;flex-shrink:0;
}
.topbar h2{font-size:16px;font-weight:600;letter-spacing:.08em;flex:1;text-align:center}
.back-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;transition:.2s;
}
.back-btn:active{transform:scale(.9);background:rgba(255,255,255,.16)}
.topbar .spacer{width:38px;flex-shrink:0}

/* ============ 关卡选择 ============ */
.level-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 40px);
  overflow-y:auto;flex:1;align-content:start;
}
.level-grid::-webkit-scrollbar{display:none}
.lvl{
  aspect-ratio:1;border-radius:14px;font-size:15px;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  transition:.18s;position:relative;
}
.lvl:active:not(:disabled){transform:scale(.9)}
.lvl.done{background:linear-gradient(135deg,rgba(176,108,255,.32),rgba(255,110,199,.24));border-color:rgba(255,110,199,.4)}
.lvl.done::after{
  content:"✓";position:absolute;top:2px;right:5px;font-size:9px;color:#ffd479;
}
.lvl.locked{opacity:.28;color:rgba(255,255,255,.4)}
.lvl.current{
  background:linear-gradient(135deg,#b06cff,#ff6ec7);
  box-shadow:0 0 20px rgba(176,108,255,.6);
  animation:pulseCur 2s ease-in-out infinite;
}
@keyframes pulseCur{0%,100%{box-shadow:0 0 16px rgba(176,108,255,.5)}50%{box-shadow:0 0 28px rgba(255,110,199,.8)}}

/* ============ 游戏区 ============ */
#play-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:4px 14px calc(env(safe-area-inset-bottom) + 30px);
  display:flex;flex-direction:column;align-items:center;
}
#play-area::-webkit-scrollbar{display:none}

.hud-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;width:100%}
.hud-pill{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:7px 13px;font-size:11.5px;letter-spacing:.04em;
  color:rgba(255,255,255,.6);white-space:nowrap;
}
.hud-pill b{color:#fff;font-size:14px;margin-left:5px;letter-spacing:.02em}
.hud-pill.warn b{color:#ff6ec7}
/* ============ 消消乐 ============ */
.m3-board{
  display:grid;gap:5px;width:100%;max-width:420px;aspect-ratio:1;
  background:rgba(255,255,255,.04);border-radius:18px;padding:9px;
  border:1px solid rgba(255,255,255,.08);
  grid-auto-rows:1fr;touch-action:none;
}
.m3-tile{
  display:flex;align-items:center;justify-content:center;
  border-radius:11px;background:rgba(255,255,255,.055);
  transition:background .15s,transform .12s,box-shadow .15s;
  cursor:pointer;line-height:1;will-change:transform;
}
.m3-tile img{width:70%;height:70%;object-fit:contain;pointer-events:none}
.m3-tile.sel{
  background:rgba(176,108,255,.35);
  box-shadow:0 0 0 2px #b06cff inset,0 0 16px rgba(176,108,255,.6);
  transform:scale(.9);
}
.m3-tile.pop{animation:tilePop .22s ease forwards}
@keyframes tilePop{
  0%{transform:scale(1)}
  45%{transform:scale(1.28);filter:brightness(2.2)}
  100%{transform:scale(.25);opacity:0}
}

/* ============ 拼图 ============ */
.pz-container{
  position:relative;width:100%;max-width:440px;margin:0 auto;
}
.pz-board{
  display:grid;gap:3px;width:100%;aspect-ratio:1;
  background:rgba(255,255,255,.05);border-radius:16px;padding:6px;
  border:1px solid rgba(255,255,255,.1);grid-auto-rows:1fr;
  touch-action:none;
}
.pz-piece{
  background-repeat:no-repeat;border-radius:6px;cursor:pointer;
  transition:transform .15s,box-shadow .15s,filter .15s;
  background-color:#1a1a24;position:relative;
}
.pz-piece.sel{
  transform:scale(.88);box-shadow:0 0 0 3px #ffd479 inset,0 0 18px rgba(255,212,121,.8);
  z-index:2;filter:brightness(1.25);
}
.pz-piece.ok{outline:1px solid rgba(120,255,180,.25);outline-offset:-1px}

.pz-preview{
  position:absolute;top:-10px;left:-10px;right:-10px;bottom:-10px;
  border-radius:20px;background-size:cover;background-position:center;
  z-index:10;pointer-events:none;
  opacity:0;transition:opacity .2s;box-shadow:0 0 40px rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.2);
}
.pz-preview.show{opacity:1}
  /* ============ 记忆卡片 ============ */
.mc-board{
  display:grid;gap:8px;width:100%;max-width:460px;margin:0 auto;
  perspective:900px;
}
.mc-card{
  aspect-ratio:3/4;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .42s cubic-bezier(.4,.1,.2,1);
  border-radius:12px;
}
.mc-card.flip{transform:rotateY(180deg)}
.mc-face{
  position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(20px,7vw,34px);
  border:1px solid rgba(255,255,255,.12);
}
.mc-back{
  background:linear-gradient(150deg,rgba(176,108,255,.3),rgba(255,110,199,.18));
  color:rgba(255,255,255,.35);font-size:16px;
}
.mc-front{
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  transform:rotateY(180deg);
}
.mc-front img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.mc-card.done .mc-front{
  background:linear-gradient(150deg,rgba(120,255,180,.28),rgba(176,108,255,.2));
  box-shadow:0 0 16px rgba(120,255,180,.35);border-color:rgba(120,255,180,.4);
}

/* ============ 打地鼠 ============ */
.wm-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  width:100%;max-width:400px;margin-top:6px;
}
.wm-hole{
  aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,#2b1f40,#100a1c 72%);
  border:2px solid rgba(255,255,255,.07);
  display:flex;align-items:flex-end;justify-content:center;
  cursor:pointer;box-shadow:inset 0 10px 22px rgba(0,0,0,.7);
}
.wm-hole::after{
  content:"";position:absolute;bottom:0;left:8%;width:84%;height:16%;
  background:radial-gradient(ellipse,rgba(176,108,255,.16),transparent 70%);
  border-radius:50%;
}
.wm-mole{
  font-size:clamp(26px,8vw,38px);line-height:1;
  transform:translateY(130%);transition:transform .11s cubic-bezier(.3,1.6,.5,1);
  position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:100%;
}
.wm-mole img{width:80%;height:80%;object-fit:contain;pointer-events:none}
.wm-hole.up .wm-mole{transform:translateY(0)}
.wm-hole.hit{animation:holeHit .2s}
@keyframes holeHit{50%{transform:scale(.88);filter:brightness(1.8)}}
.wm-hole.boom{animation:holeBoom .3s;background:radial-gradient(circle,#ff5b5b,#2a0a0a)}
@keyframes holeBoom{50%{transform:scale(1.08)}}

/* ============ 2048 ============ */
.g2048-wrap{width:100%;max-width:420px;margin:0 auto}
.g2048-board{
  display:grid;gap:8px;background:rgba(255,255,255,.06);
  border-radius:16px;padding:8px;aspect-ratio:1;width:100%;
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  border:1px solid rgba(255,255,255,.1);touch-action:none;
}
.t2048{
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(15px,5.5vw,30px);
  background:rgba(255,255,255,.05);color:#fff;
  transition:background .1s,transform .08s;letter-spacing:-.02em;
  background-size:cover;background-position:center;
  text-shadow:0 1px 4px rgba(0,0,0,.8), 0 0 10px rgba(0,0,0,.5);
  position:relative;overflow:hidden;
}
.t2048.has-img::before{
  content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:1;
}
.t2048 span{position:relative;z-index:2}
.t2048.new{animation:tileNew .18s ease}
@keyframes tileNew{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.t2048[data-v="2"]{background:rgba(255,255,255,.14)}
.t2048[data-v="4"]{background:rgba(255,212,121,.28);color:#fff5d8}
.t2048[data-v="8"]{background:linear-gradient(135deg,#f6a54a,#ef8a2c);color:#3a1a00}
.t2048[data-v="16"]{background:linear-gradient(135deg,#f58a4a,#e8622c);color:#fff}
.t2048[data-v="32"]{background:linear-gradient(135deg,#f2685f,#d93a4c);color:#fff}
.t2048[data-v="64"]{background:linear-gradient(135deg,#e04bd0,#a12ec4);color:#fff}
.t2048[data-v="128"]{background:linear-gradient(135deg,#b06cff,#7b3bf0);color:#fff}
.t2048[data-v="256"]{background:linear-gradient(135deg,#8a6cff,#5a2bd8);color:#fff;box-shadow:0 0 14px rgba(138,108,255,.6)}
.t2048[data-v="512"]{background:linear-gradient(135deg,#4ac6ff,#1f7ae0);color:#fff;box-shadow:0 0 16px rgba(74,198,255,.6)}
.t2048[data-v="1024"]{background:linear-gradient(135deg,#3ef0b0,#12b183);color:#023;box-shadow:0 0 18px rgba(62,240,176,.6)}
.t2048[data-v="2048"]{background:linear-gradient(135deg,#ffd479,#ff9a3c);color:#3a1a00;box-shadow:0 0 26px rgba(255,212,121,.85)}
/* ============ 设置面板 ============ */
.panel{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:flex-end;justify-content:center;
}
.panel.open{display:flex}
.panel-mask{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);animation:fadeIn .25s}
.panel-box{
  position:relative;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#181228,#0e0a18);
  border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 26px);
  border-top:1px solid rgba(255,255,255,.14);
  animation:slideUp .32s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.panel-box::-webkit-scrollbar{display:none}
.panel-box h3{font-size:16px;letter-spacing:.1em;margin-bottom:18px;text-align:center;font-weight:600}
.panel-sec{margin-bottom:20px}
.panel-sec label{
  display:block;font-size:11.5px;color:rgba(255,255,255,.5);
  letter-spacing:.1em;margin-bottom:10px;
}
.bg-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.bg-preset{
  aspect-ratio:1;border-radius:12px;border:2px solid transparent;
  transition:.18s;position:relative;overflow:hidden;
}
.bg-preset:active{transform:scale(.92)}
.bg-preset.active{border-color:#ffd479;box-shadow:0 0 14px rgba(255,212,121,.5)}

.row-flex{display:flex;gap:10px;align-items:center}
input[type=text],input[type=url]{
  flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:11px;padding:11px 13px;color:#fff;font-size:13px;outline:none;
  min-width:0;
  }
input[type=text]:focus,input[type=url]:focus{border-color:rgba(176,108,255,.6)}
.btn-sm{
  padding:11px 16px;border-radius:11px;font-size:12.5px;font-weight:600;
  background:linear-gradient(135deg,#b06cff,#ff6ec7);white-space:nowrap;
  transition:.2s;
}
.btn-sm:active{transform:scale(.94)}
.btn-ghost{
  padding:11px 16px;border-radius:11px;font-size:12.5px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
}
input[type=range]{
  width:100%;-webkit-appearance:none;height:4px;border-radius:2px;
  background:rgba(255,255,255,.15);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#b06cff,#ff6ec7);cursor:pointer;
  box-shadow:0 0 10px rgba(176,108,255,.7);
}
.range-row{display:flex;align-items:center;gap:12px}
.range-row span{font-size:11px;color:rgba(255,255,255,.4);width:38px;text-align:right;flex-shrink:0}
.color-row{display:flex;gap:9px;flex-wrap:wrap}
.color-dot{
  width:36px;height:36px;border-radius:50%;border:2px solid transparent;transition:.18s;
}
.color-dot:active{transform:scale(.9)}
.color-dot.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.5)}

/* ============ 弹窗 ============ */
.modal{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:24px;
}
.modal.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);animation:fadeIn .22s}
.modal-box{
  position:relative;width:100%;max-width:340px;
  background:linear-gradient(170deg,#1d1533,#0e0a1a);
  border:1px solid rgba(255,255,255,.14);border-radius:24px;
  padding:30px 24px 24px;text-align:center;
  animation:modalIn .38s cubic-bezier(.2,1.2,.4,1);
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}

  .level-grid{grid-template-columns:repeat(4,1fr)}
}

  .game-grid{grid-template-columns:repeat(3,1fr);gap:18px}
}

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rndInt = n => Math.floor(Math.random() * n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rndInt(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function makeArt(seed){
  let s = (seed * 2654435761) >>> 0;
  const rand = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const hue  = Math.floor(rand() * 360);
  const hue2 = (hue + 50 + Math.floor(rand() * 160)) % 360;
  let shapes = '';
  for (let i = 0; i < 16; i++){
    const t = Math.floor(rand() * 3);
    const x = rand() * 100, y = rand() * 100, r = 5 + rand() * 20;
    const h = (hue + rand() * 220) % 360;
    const op = (0.3 + rand() * 0.55).toFixed(2);
    const lt = 45 + Math.floor(rand() * 30);
    if (t === 0){
      shapes += `<circle cx="${x.toFixed(1)}%" cy="${y.toFixed(1)}%" r="${r.toFixed(1)}%" fill="hsl(${h.toFixed(0)},80%,${lt}%)" opacity="${op}"/>`;
    } else if (t === 1){
      shapes += `<rect x="${x.toFixed(1)}%" y="${y.toFixed(1)}%" width="${(r*1.3).toFixed(1)}%" height="${(r*1.3).toFixed(1)}%" rx="6" fill="hsl(${h.toFixed(0)},85%,${lt}%)" opacity="${op}" transform="rotate(${(rand()*90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    } else {
      const x2 = x + (rand()-0.5)*30, y2 = y + (rand()-0.5)*30, x3 = x + (rand()-0.5)*30, y3 = y + (rand()-0.5)*30;
      shapes += `<polygon points="${x.toFixed(1)},${y.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} ${x3.toFixed(1)},${y3.toFixed(1)}" fill="hsl(${h.toFixed(0)},85%,${lt}%)" opacity="${op}"/>`;
    }
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="hsl(${hue},68%,22%)"/>
        <stop offset="55%" stop-color="hsl(${(hue+hue2)/2|0},72%,38%)"/>
        <stop offset="100%" stop-color="hsl(${hue2},82%,55%)"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#g)"/>
    ${shapes}
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function getPuzzleImage(level){
  const arr = ASSETS.puzzle;
  if (arr && arr.length >= level && arr[level - 1]) return arr[level - 1];
  return makeArt(level * 13 + 7);
}

function openLevels(gameId){
  currentGameId = gameId;
  const g = GAMES.find(x => x.id === gameId);
  $('#levels-title').textContent = g.name;

  const doneCount = Persist.progress[gameId] || 0;
  const maxUnlocked = doneCount + 1;

  let html = '';
  for (let i = 1; i <= ASSETS.totalLevels; i++){
    const locked = i > maxUnlocked;
    const done = i <= doneCount;
    const current = i === maxUnlocked && !locked;
    const cls = ['lvl'];
    if (locked) cls.push('locked');
    if (done) cls.push('done');
    if (current) cls.push('current');
    html += `<button class="${cls.join(' ')}" data-lvl="${i}" ${locked ? 'disabled' : ''}>${i}</button>`;
  }
  $('#level-grid').innerHTML = html;
  $('#level-grid').onclick = e => {
    const btn = e.target.closest('.lvl');
    if (!btn || btn.disabled) return;
    startLevel(gameId, +btn.dataset.lvl);
  };

function findMatches(grid, rows, cols){
  const out = new Set();
  for (let r = 0; r < rows; r++){
    let run = 1;
    for (let c = 1; c <= cols; c++){
      const same = c < cols && grid[r][c] !== null && grid[r][c-1] !== null && grid[r][c] === grid[r][c-1];
      if (same) run++;
      else {
        if (run >= 3) for (let k = c - run; k < c; k++) out.add(r * cols + k);
        run = 1;
      }
    }
  }
  for (let c = 0; c < cols; c++){
    let run = 1;
    for (let r = 1; r <= rows; r++){
      const same = r < rows && grid[r][c] !== null && grid[r-1][c] !== null && grid[r][c] === grid[r-1][c];
      if (same) run++;
      else {
        if (run >= 3) for (let k = r - run; k < r; k++) out.add(k * cols + c);
        run = 1;
      }
    }
  }
  return out;
}
G.match3 = {
  level: 1, rows: 6, cols: 6, colors: 5,
  grid: [], sel: null, moves: 0, target: 0, score: 0,
  busy: false, over: false, boardEl: null, areaEl: null, gameId: 'match3',
  
  startR: -1, startC: -1, startX: 0, startY: 0,

  start(level, area, gameId){
    this.gameId = gameId;
    window.__currentLevel = level;
    this.level = level;
    this.areaEl = area;
    this.cols = Math.min(8, 5 + Math.floor(level / 12));
    this.rows = this.cols;
    this.colors = ASSETS.match3.length;
    this.moves = Math.max(15, 28 - Math.floor(level / 4));
    this.target = 300 + level * 40;
    this.score = 0;
    this.sel = null;
    this.busy = false;
    this.over = false;
    this.initGrid();

    area.innerHTML = `
      <div class="hud-row">
        <div class="hud-pill">分数 <b id="m3-score">0</b></div>
        <div class="hud-pill">目标 <b id="m3-target">${this.target}</b></div>
        <div class="hud-pill" id="m3-moves-pill">步数 <b id="m3-moves">${this.moves}</b></div>
      </div>
      <div class="m3-board" id="m3-board"></div>
      <p style="margin-top:14px;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.08em;text-align:center">滑动或点击相邻两颗宝石进行交换</p>`;

    this.boardEl = area.querySelector('#m3-board');
    this.boardEl.style.gridTemplateColumns = `repeat(${this.cols},1fr)`;
    this.boardEl.style.fontSize = `calc(min(88vw, 420px) / ${this.cols} * 0.5)`;
    
    this._onPointerDown = (e) => {
      if (this.busy || this.over) return;
      const t = e.target.closest('.m3-tile');
      if (!t) return;
      this.startR = +t.dataset.r;
      this.startC = +t.dataset.c;
      this.startX = e.clientX;
      this.startY = e.clientY;
    };

    this._onPointerUp = (e) => {
      if (this.busy || this.over) return;
      if (this.startR === -1) return;
      
      const dx = e.clientX - this.startX;
      const dy = e.clientY - this.startY;
      const dist = Math.hypot(dx, dy);
      
      let targetR = this.startR;
      let targetC = this.startC;
      
      if (dist > 20) {
        if (Math.abs(dx) > Math.abs(dy)) targetC += dx > 0 ? 1 : -1;
        else targetR += dy > 0 ? 1 : -1;
      } else {
        const t = e.target.closest('.m3-tile');
        if (t) {
          targetR = +t.dataset.r;
          targetC = +t.dataset.c;
        }
      }
const isSame = targetR === this.startR && targetC === this.startC;
      const isAdj = Math.abs(targetR - this.startR) + Math.abs(targetC - this.startC) === 1;

      if (isAdj && targetR >= 0 && targetR < this.rows && targetC >= 0 && targetC < this.cols) {
        this.sel = null;
        this.trySwap({r: this.startR, c: this.startC}, {r: targetR, c: targetC});
      } else if (isSame) {
        if (this.sel && this.sel.r === this.startR && this.sel.c === this.startC) {
          this.sel = null;
        } else {
          this.sel = {r: this.startR, c: this.startC};
        }
        this.render();
      }
      this.startR = -1;
    };

    this.boardEl.addEventListener('pointerdown', this._onPointerDown);
    this.boardEl.addEventListener('pointerup', this._onPointerUp);
    this.render();
  },

  stop(){
    if (this.boardEl) {
      this.boardEl.removeEventListener('pointerdown', this._onPointerDown);
      this.boardEl.removeEventListener('pointerup', this._onPointerUp);
    }
    this.over = true;
    this.busy = true;
  },
  initGrid(){
    let guard = 0;
    do {
      this.grid = [];
      for (let r = 0; r < this.rows; r++){
        this.grid[r] = [];
        for (let c = 0; c < this.cols; c++){
          let v, badGuard = 0;
          do { v = rndInt(this.colors); badGuard++; }
          while (badGuard < 60 && this._bad(r, c, v));
          this.grid[r][c] = v;
        }
      }
      guard++;
    } while (guard < 100 && !this.hasValidMove()); // 确保初始棋盘有解
  },

  _bad(r, c, v){
    if (c >= 2 && this.grid[r][c-1] === v && this.grid[r][c-2] === v) return true;
    if (r >= 2 && this.grid[r-1][c] === v && this.grid[r-2][c] === v) return true;
    return false;
  },

  // 检测是否还有可交换的步骤
  hasValidMove(){
    const g = this.grid;
    for (let r = 0; r < this.rows; r++){
      for (let c = 0; c < this.cols; c++){
        // 尝试向右交换
        if (c < this.cols - 1) {
          let tmp = g[r][c]; g[r][c] = g[r][c+1]; g[r][c+1] = tmp;
          if (findMatches(g, this.rows, this.cols).size > 0) {
            tmp = g[r][c]; g[r][c] = g[r][c+1]; g[r][c+1] = tmp;
            return true;
          }
          tmp = g[r][c]; g[r][c] = g[r][c+1]; g[r][c+1] = tmp; // 换回来
        }
        // 尝试向下交换
        if (r < this.rows - 1) {
          let tmp = g[r][c]; g[r][c] = g[r+1][c]; g[r+1][c] = tmp;
          if (findMatches(g, this.rows, this.cols).size > 0) {
            tmp = g[r][c]; g[r][c] = g[r+1][c]; g[r+1][c] = tmp;
            return true;
          }
          tmp = g[r][c]; g[r][c] = g[r+1][c]; g[r+1][c] = tmp; // 换回来
        }
      }
    }
    return false;
  },

  // 洗牌直到有解
  shuffleBoard(){
    toast('无解啦，自动洗牌~');
    let guard = 0;
    do {
      const all = [];
      for (let r = 0; r < this.rows; r++)
        for (let c = 0; c < this.cols; c++)
          all.push(this.grid[r][c]);
      shuffle(all);
      
      let idx = 0;
      for (let r = 0; r < this.rows; r++)
        for (let c = 0; c < this.cols; c++)
          this.grid[r][c] = all[idx++];
      
      guard++;
    } while (guard < 100 && (findMatches(this.grid, this.rows, this.cols).size > 0 || !this.hasValidMove()));
    this.render();
  },

  render(popping){
    if (!this.boardEl) return;
    let html = '';
    for (let r = 0; r < this.rows; r++){
      for (let c = 0; c < this.cols; c++){
        const v = this.grid[r][c];
        const sel = this.sel && this.sel.r === r && this.sel.c === c;
        const pop = popping && v === null;
        html += `<div class="m3-tile${sel ? ' sel' : ''}${pop ? ' pop' : ''}" data-r="${r}" data-c="${c}">${v === null ? '' : getMatch3TileHtml(v)}</div>`;
      }
    }
    this.boardEl.innerHTML = html;
  },

  updateHUD(){
    const s = document.getElementById('m3-score');
    const m = document.getElementById('m3-moves');
    const p = document.getElementById('m3-moves-pill');
    if (s) s.textContent = this.score;
    if (m) m.textContent = this.moves;
    if (p) p.classList.toggle('warn', this.moves <= 5);
  },

  swapCells(a, b){
    const t = this.grid[a.r][a.c];
    this.grid[a.r][a.c] = this.grid[b.r][b.c];
    this.grid[b.r][b.c] = t;
  },

  async trySwap(a, b){
    if (this.over) return;
    this.busy = true;
    this.swapCells(a, b);
    this.render();
    await sleep(170);
    if (this.over) return;

    let m = findMatches(this.grid, this.rows, this.cols);
    if (m.size === 0){
      // 没消除，换回来
      this.swapCells(a, b);
      this.render();
      this.busy = false;
      return;
            }
    this.moves--;
    this.updateHUD();

    let combo = 0;
    while (true){
      m = findMatches(this.grid, this.rows, this.cols);
      if (m.size === 0) break;
      combo++;
      this.score += m.size * 10 * combo;

const snapshot = new Set(m);
      const tiles = this.boardEl.querySelectorAll('.m3-tile');
      snapshot.forEach(idx => {
        const el = tiles[idx];
        if (el) el.classList.add('pop');
      });
      await sleep(230);
      snapshot.forEach(idx => {
        this.grid[Math.floor(idx / this.cols)][idx % this.cols] = null;
      });
      this.render();
      this.updateHUD();
      await sleep(120);

      this.drop();
      this.render();
      await sleep(190);
    }

    this.updateHUD();
    
    // 检查是否胜利
    if (this.score >= this.target){ this.over = true; onLevelWin(); return; }
    if (this.moves <= 0){ this.over = true; onLevelLose(`分数 ${this.score} / 目标 ${this.target}，再试一次吧！`); return; }
    
    // 如果没结束，检查是否有解
    if (!this.hasValidMove()) {
      this.shuffleBoard();
    }
    
    this.busy = false;
  },

  drop(){
    for (let c = 0; c < this.cols; c++){
      let write = this.rows - 1;
      for (let r = this.rows - 1; r >= 0; r--){
        if (this.grid[r][c] !== null){
          this.grid[write][c] = this.grid[r][c];
          if (write !== r) this.grid[r][c] = null;
          write--;
        }
      }
      for (let r = write; r >= 0; r--){
        this.grid[r][c] = rndInt(this.colors);
      }
    }
  }
};

  initBoard(level, area, gameId){

    area.innerHTML = `
      <div class="hud-row">
        <div class="hud-pill">拼块 <b>${n} × ${n}</b></div>
        <div class="hud-pill">步数 <b id="pz-moves">0</b></div>

    const preview = area.querySelector('#pz-preview');
    const peek = area.querySelector('#pz-peek');
    peek.style.touchAction = 'none';
    peek.style.userSelect = 'none';
    
    const showPreview = (e) => { e.preventDefault(); preview.classList.add('show'); };
    const hidePreview = (e) => { if(e) e.preventDefault(); preview.classList.remove('show'); };
    peek.addEventListener('pointerdown', showPreview);
    peek.addEventListener('pointerup', hidePreview);
    peek.addEventListener('pointerleave', hidePreview);
    peek.addEventListener('pointercancel', hidePreview);
     area.querySelector('#pz-shuffle').onclick = () => {
      if (this.over) return;
      let guard2 = 0;
      do { shuffle(this.order); guard2++; } while (guard2 < 200 && this.order.filter((v, i) => v === i).length > Math.max(0, total - 4));
      this.moves = 0;
      this.sel = null;
      this.render();
      area.querySelector('#pz-moves').textContent = '0';
    };

    this._onPointerDown = (e) => {
      if (this.over) return;
      const t = e.target.closest('.pz-piece');
      if (!t) return;
      this.startI = +t.dataset.i;
      this.startX = e.clientX;
      this.startY = e.clientY;
    };
    this._onPointerUp = (e) => {
      if (this.over || this.startI === -1) return;
      
      const dx = e.clientX - this.startX;
      const dy = e.clientY - this.startY;
      const dist = Math.hypot(dx, dy);
      
      let targetI = this.startI;
      
      if (dist > 20) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const t = el ? el.closest('.pz-piece') : null;
        if (t) targetI = +t.dataset.i;
        else { this.startI = -1; return; }
      } else {
        const el = e.target.closest('.pz-piece');
        if (el) targetI = +el.dataset.i;
      }

      if (targetI !== this.startI) {
        const tmp = this.order[this.startI];
        this.order[this.startI] = this.order[targetI];
        this.order[targetI] = tmp;
        this.moves++;
        this.sel = null;
        this.render();
        const mEl = document.getElementById('pz-moves');
        if (mEl) mEl.textContent = this.moves;

        if (this.order.every((v, idx) => v === idx)){
          this.over = true;
          setTimeout(() => onLevelWin(), 260);
        }
      } else {
        if (this.sel === this.startI) this.sel = null;
        else this.sel = this.startI;
        this.render();
      }
      
      this.startI = -1;
    };

    this.boardEl.addEventListener('pointerdown', this._onPointerDown);
    this.boardEl.addEventListener('pointerup', this._onPointerUp);
    this.boardEl.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    this.render();
  },

  stop(){
    if (this.boardEl) {
      this.boardEl.removeEventListener('pointerdown', this._onPointerDown);
      this.boardEl.removeEventListener('pointerup', this._onPointerUp);
    }
    this.over = true;
  },

  render(){
    if (!this.boardEl) return;
    const n = this.size;
    
    let pieces = '';
    for (let i = 0; i < n * n; i++){
      const p = this.order[i];
      const r = Math.floor(p / n), c = p % n;
      const px = n === 1 ? 0 : (c / (n - 1)) * 100;
      const py = n === 1 ? 0 : (r / (n - 1)) * 100;
      const selCls = this.sel === i ? ' sel' : '';
      const okCls = p === i ? ' ok' : '';
      pieces += `<div class="pz-piece${selCls}${okCls}" data-i="${i}"
        style="background-image:url('${this.img}');
               background-size:${n * 100}% ${n * 100}%;
               background-position:${px}% ${py}%"></div>`;
    }
    this.boardEl.innerHTML = pieces;
  }
};

G.memory = {

  boardEl: null, gameId: 'memory', over: false, pairs: 0,

    this.gameId = gameId;

    this.pairs = Math.min(12, 4 + Math.floor((level - 1) / 6));
    this.timeLeft = this.pairs * 9 + 8;
    this.picked = [];
    this.lock = false;
    this.over = false;

    const groups = ASSETS.memoryGroups;
    const group = groups[rndInt(groups.length)];
    const pool = group.items;
    const chosen = shuffle([...pool]).slice(0, this.pairs);
    const deck = shuffle([...chosen, ...chosen]);
    this.cards = deck.map(e => ({ face: e, flipped: false, done: false }));

    const total = this.cards.length;
    let cols = 4;
    if (total <= 8) cols = 4;
    else if (total <= 12) cols = 4;
    else if (total <= 16) cols = 4;
    else if (total <= 20) cols = 5;
    else cols = 6;
    area.innerHTML = `
      <div class="hud-row">
        <div class="hud-pill">主题 <b>${group.name}</b></div>

      </div>

    this.boardEl = area.querySelector('#mc-board');
    this.boardEl.addEventListener('pointerdown', this._onClick);
    this.render();

    this.timerId = setInterval(() => {
      if (this.over) return;
      this.timeLeft--;
      const tEl = document.getElementById('mc-time');
      const pEl = document.getElementById('mc-time-pill');

        this.over = true;
        clearInterval(this.timerId);

      }
    }, 1000);
  },

    this.timerId = null;
    if (this.boardEl) this.boardEl.removeEventListener('pointerdown', this._onClick);
    this.over = true;
  },

    const self = G.memory;
    const el = e.target.closest('.mc-card');
    if (!el || self.over) return;
    self.flip(+el.dataset.i);
  },

  flip(i){
    const c = this.cards[i];
    if (!c || c.flipped || c.done || this.lock) return;
    c.flipped = true;
    this.render();

    this.picked.push(i);
    if (this.picked.length === 2){
      const [a, b] = this.picked;
      this.lock = true;
      if (this.cards[a].face.name === this.cards[b].face.name){
        setTimeout(() => {
          this.cards[a].done = true;
          this.cards[b].done = true;
          this.picked = [];
          this.lock = false;
          this.render();
          this.checkWin();
        }, 320);
      } else {
        setTimeout(() => {
          this.cards[a].flipped = false;
          this.cards[b].flipped = false;
          this.picked = [];
          this.lock = false;
          this.render();
        }, 680);
      }
    }
  },

  checkWin(){
    const doneCount = this.cards.filter(c => c.done).length / 2;
    const pEl = document.getElementById('mc-pairs');
    if (pEl) pEl.textContent = doneCount;
    if (doneCount >= this.pairs){
      this.over = true;
      clearInterval(this.timerId);
      setTimeout(() => onLevelWin(), 300);
    }
  },

  render(){
    if (!this.boardEl) return;
    let html = '';
    this.cards.forEach((c, i) => {
      const flip = c.flipped || c.done;
      const done = c.done;
      
      let faceContent = c.face.emoji;
      if (c.face.img) faceContent = `<img src="${c.face.img}" onerror="this.outerHTML='${c.face.emoji}'">`;

      html += `<div class="mc-card${flip ? ' flip' : ''}${done ? ' done' : ''}" data-i="${i}">
        <div class="mc-face mc-back">?</div>
        <div class="mc-face mc-front">${faceContent}</div>
      </div>`;
    });
    this.boardEl.innerHTML = html;
    this.checkWinSilent();
  },

  checkWinSilent(){
    const doneCount = this.cards.filter(c => c.done).length / 2;
    const pEl = document.getElementById('mc-pairs');
    if (pEl) pEl.textContent = doneCount;
  }
};

    window.removeEventListener('keydown', this._keyHandler);
    if (this.boardEl){
      this.boardEl.removeEventListener('pointerdown', this._down);
      this.boardEl.removeEventListener('pointerup', this._up);
    }
    this.over = true;
  },

  spawn(){
    const empty = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (this.grid[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[rndInt(empty.length)];
    this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  },

  move(dir){
    if (this.over) return;
    const before = JSON.stringify(this.grid);
    const g = this.grid;

    const slide = arr => {
      const nz = arr.filter(v => v !== 0);
      const out = [];
      for (let i = 0; i < nz.length; i++){
        if (i < nz.length - 1 && nz[i] === nz[i+1]){
          out.push(nz[i] * 2);
          this.score += nz[i] * 2;
          i++;
        } else {
          out.push(nz[i]);
        }
      }
      while (out.length < 4) out.push(0);
      return out;
    };
if (dir === 'left' || dir === 'right'){
      for (let r = 0; r < 4; r++){
        let row = g[r].slice();
        if (dir === 'right') row.reverse();
        row = slide(row);
        if (dir === 'right') row.reverse();
        g[r] = row;
      }
    } else {
      for (let c = 0; c < 4; c++){
        let col = [g[0][c], g[1][c], g[2][c], g[3][c]];
        if (dir === 'down') col.reverse();
        col = slide(col);
        if (dir === 'down') col.reverse();
        for (let r = 0; r < 4; r++) g[r][c] = col[r];
      }
    }

    if (JSON.stringify(this.grid) === before) return;

    this.spawn();
    this.render();

    const sEl = document.getElementById('g2-score');
    if (sEl) sEl.textContent = this.score;

    let maxV = 0;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) maxV = Math.max(maxV, g[r][c]);
    if (maxV >= this.target && !this.won){
      this.won = true;
      this.over = true;
      setTimeout(() => onLevelWin(), 320);
      return;
    }

    if (!this.canMove()){
      this.over = true;
      setTimeout(() => onLevelLose(`棋盘已满，最高方块 ${maxV}，目标是 ${this.target}`), 320);
    }
  },
  canMove(){
    const g = this.grid;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++){
        if (g[r][c] === 0) return true;
        if (c < 3 && g[r][c] === g[r][c+1]) return true;
        if (r < 3 && g[r][c] === g[r+1][c]) return true;
      }
    return false;
  },

  render(){
    if (!this.boardEl) return;
    let html = '';
    for (let r = 0; r < 4; r++){
      for (let c = 0; c < 4; c++){
        const v = this.grid[r][c];
        if (v === 0) {
          html += `<div class="t2048"></div>`;
        } else {
          const item = ASSETS.g2048.find(x => x.num === v);
          let imgStyle = '', hasImgClass = '';
          if (item && item.img) {
            imgStyle = `background-image: url('${item.img}');`;
            hasImgClass = ' has-img';
          }
          const emojiStr = item && item.emoji ? item.emoji + ' ' : '';
          html += `<div class="t2048 new${hasImgClass}" data-v="${v}" style="${imgStyle}">
            <span>${emojiStr}${v}</span>
          </div>`;
        }
      }
    }
    this.boardEl.innerHTML = html;
  }
};

/* ==========================================================================
   开场动画 & 初始化
   ========================================================================== */
const Intro = {
  running: false,
  async play(){
    this.running = true;
    const welcome = $('#intro-welcome');
    const fill = $('#loading-fill');
    const linesBox = $('#intro-lines');
    const lines = [$('#il0'), $('#il1'), $('#il2')];

    welcome.classList.add('show');
    await sleep(100);
    fill.style.width = '100%'; 
    
    await sleep(2400); 
    if (!this.running) return;
    welcome.classList.remove('show');
    welcome.classList.add('hide');
    await sleep(600); 
    if (!this.running) return;

    linesBox.classList.add('show');
    for (const l of lines){
      if (!this.running) return;
      l.classList.add('show');
      await sleep(1350);
    }

    await sleep(1200);
    if (!this.running) return;
    this.finish();
  },

  async finish(){
    this.running = false;
    const intro = $('#intro');
    intro.classList.add('fading');
    await sleep(760);
    intro.style.display = 'none';
    intro.classList.remove('active');
    showScreen('home');
    renderHome();
  }
};

function init(){
  BGSystem.init();

  $('#skip-intro').onclick = () => {
    if (Intro.running){
      Intro.running = false;
      Intro.finish();
    }
  };

  $('#open-settings').onclick = () => BGSystem.open();

  $('#levels-back').onclick = () => { showScreen('home'); renderHome(); };
  $('#play-back').onclick = () => {
    stopActiveGame();
    if (currentGameId) openLevels(currentGameId);
    else showScreen('home');
  };

  document.querySelector('#modal .modal-mask').onclick = () => closeModal();

  document.addEventListener('touchmove', e => {
    if (e.target.closest('#play-area, .level-grid, .game-grid, .panel-box')) return;
    e.preventDefault();
  }, { passive: false });

  Intro.play();
}

window.addEventListener('load', init);
</script>
